<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f3a8a">
<title>Hostel Asset Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fb;--surface:#fff;--ink:#141a2e;--ink2:#3b4560;--muted:#6b7590;--line:#e4e8f1;--line2:#eef1f7;
  --brand:#2f54eb;--brand-d:#1f3a8a;--brand-s:#eaf0ff;
  --green:#12805c;--green-s:#e3f6ee;--amber:#b45309;--amber-s:#fdf2dc;--red:#c8323b;--red-s:#fde8e9;
  --violet:#6d3fd6;--violet-s:#efe9fd;--cyan:#0e7490;--cyan-s:#e0f4f8;--slate-s:#eef1f6;
  --r:14px;--r-s:10px;--sh:0 1px 2px rgba(20,26,46,.05),0 4px 16px rgba(20,26,46,.05);
  --sh-l:0 20px 60px rgba(20,26,46,.22);
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--display:"Plus Jakarta Sans",var(--font);
  --side:248px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand);text-decoration:none}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.side{width:var(--side);flex:none;background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:30}
.brand{display:flex;gap:11px;align-items:center;padding:20px 18px 16px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#3d63f5,#1f3a8a);display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px rgba(47,84,235,.35)}
.logo svg{width:21px;height:21px}
.brand b{font-family:var(--display);font-size:15.5px;line-height:1.15;display:block}
.brand span{font-size:12px;color:var(--muted)}
.nav{flex:1;overflow-y:auto;padding:4px 10px 12px}
/* one soft colour block per menu section */
.nav .sec{--tint:#eef1f6;--ink:#2c3344;--icon:#5b6478;background:var(--tint);border-radius:12px;padding:7px 6px 6px;margin-bottom:8px}
.nav .sec-blue{--tint:#e8efff;--ink:#1f3a8a;--icon:#2f54eb}
.nav .sec-teal{--tint:#e1f5ee;--ink:#085041;--icon:#0f8a66}
.nav .sec-amber{--tint:#fdf1dc;--ink:#633806;--icon:#c47a0b}
.nav .sec-violet{--tint:#efecfe;--ink:#3c3489;--icon:#6d3fd6}
.nav .sec-slate{--tint:#eef0f4;--ink:#2c3344;--icon:#5b6478}
.nav h6{margin:2px 8px 4px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);opacity:.85;font-weight:700}
.nav a{display:flex;align-items:center;gap:10px;padding:7.5px 8px;border-radius:8px;color:var(--ink2);font-weight:500;margin-bottom:1px}
.nav a svg{color:var(--icon)}
.nav a:hover{background:rgba(255,255,255,.65)}
.nav a.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(20,26,46,.08)}
.nav a.on svg{color:var(--icon)}
.nav a .n{margin-left:auto;font-size:11.5px;font-weight:600;min-width:22px;text-align:center;padding:1px 7px;border-radius:99px;background:rgba(20,26,46,.07);color:var(--ink)}
.nav a .n.hot{background:var(--red);color:#fff}
.me{border-top:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;background:var(--brand-s);color:var(--brand-d);display:grid;place-items:center;font-weight:700;font-size:12.5px;flex:none}
.me .t{min-width:0;flex:1}.me b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.me .t span{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:0;background:transparent;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--muted);cursor:pointer}
.iconbtn:hover{background:var(--line2);color:var(--ink)}
.iconbtn:disabled{opacity:.3;cursor:not-allowed;background:transparent!important;color:var(--muted)!important}
.iconbtn.del:hover{background:var(--red-s);color:var(--red)}
.main{flex:1;min-width:0;padding:26px 30px 60px}
.topbar{display:none}

/* ---------- page head ---------- */
.ph{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-size:25px;font-weight:800}
.ph p{margin:3px 0 0;color:var(--muted)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8.5px 14px;border-radius:10px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--ink2);transition:background .12s,border-color .12s,transform .05s}
.btn:hover{border-color:#cfd5e3;background:#fafbfe}
.btn:active{transform:translateY(1px)}
.btn svg.i{width:16px;height:16px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(47,84,235,.25)}
.btn.pri:hover{background:#2547d6}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.ok:hover{background:#0e6d4e}
.btn.bad{color:var(--red);border-color:#f1c6c9}
.btn.bad:hover{background:var(--red-s)}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:default}

/* ---------- stat cards ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tone,var(--brand))}
.stat{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:62px}
.stat .v{font-family:var(--display);font-size:24px;font-weight:800;line-height:1.1;color:var(--ink);text-align:right;white-space:nowrap;flex:none}
.stat .l{color:var(--ink2);font-size:13px;font-weight:500;line-height:1.3}
.stat.click{cursor:pointer}.stat.click:hover{border-color:#cfd5e3}
.t-green{--tone:var(--green)}.t-amber{--tone:#e08a0b}.t-red{--tone:var(--red)}.t-violet{--tone:var(--violet)}.t-cyan{--tone:var(--cyan)}.t-slate{--tone:#8a93ab}

/* ---------- segmented tabs (Approvals) ---------- */
.segtabs{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--line2);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px;max-width:100%}
.segtabs button{border:1px solid transparent;background:transparent;border-radius:9px;padding:8px 14px;font-weight:600;font-size:13.5px;color:var(--muted);display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.segtabs button:hover{color:var(--ink)}
.segtabs button svg.i{width:16px;height:16px}
.segtabs button.on{background:#fff;color:var(--ink);border-color:var(--line);box-shadow:0 1px 3px rgba(20,26,46,.08)}
.segtabs .n{font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;background:#fff;color:var(--muted)}
.segtabs .on .n{background:var(--brand-s);color:var(--brand-d)}
/* ---------- filters ---------- */
.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;margin-bottom:12px;box-shadow:var(--sh)}
.search{position:relative;flex:1 1 220px;min-width:180px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#9aa3b9;width:17px;height:17px}
.inp,.filters select,.filters input[type=date]{height:38px;border:1px solid var(--line);border-radius:9px;padding:0 11px;background:#fbfcfe;outline:none;min-width:0}
.search .inp{width:100%;padding-left:35px}
.filters select{padding-right:28px;max-width:220px}
.inp:focus,.filters select:focus,.filters input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,84,235,.14);background:#fff}
.flab{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px}
.clear{border:0;background:transparent;color:var(--brand);font-weight:600;cursor:pointer;padding:6px 8px}

/* ---------- cards & tables ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.card+.card{margin-top:14px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line2)}
.ch h3{font-size:15.5px}.ch .sub{color:var(--muted);font-size:12.5px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:#f8f9fc;text-align:left;font-weight:600;color:var(--muted);font-size:12px;letter-spacing:.02em;padding:9px 8px;border-bottom:1px solid var(--line);white-space:normal;line-height:1.3;vertical-align:bottom;cursor:pointer;user-select:none}
th.ns{cursor:default}
th .ar{opacity:.35;font-size:10px;margin-left:4px}
th[data-sort]:hover{color:var(--ink);background:#f1f3f9}
th[data-sort]:hover .ar{opacity:.8}
th.sorted{color:var(--brand-d)}th.sorted .ar{opacity:1;color:var(--brand)}
.sortbar{display:none;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line2);color:var(--muted);font-size:12.5px}
.sortbar select{flex:1;height:34px;border:1px solid var(--line);border-radius:9px;padding:0 9px;background:#fbfcfe;min-width:0}
td{padding:9px 8px;border-bottom:1px solid var(--line2);vertical-align:top;white-space:normal;overflow-wrap:break-word;word-break:normal;line-height:1.4}
td.num,td .mono{white-space:nowrap}
td .b{white-space:normal;line-height:1.3;display:inline-flex;align-items:baseline}
td .rowacts{flex-wrap:wrap;gap:5px}
td .rowacts .btn.sm{padding:5px 9px;white-space:normal;text-align:center;line-height:1.25}
/* cell borders on every table */
.tw table{border-collapse:collapse}
.tw th,.tw td{border:1px solid var(--line)}
.tw tr:first-child th{border-top:0}
.tw tr>:first-child{border-left:0}.tw tr>:last-child{border-right:0}
.tw tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#fafbff}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.strong{font-weight:700}
td.dim{color:var(--muted)}
td.wrap{color:var(--ink2)}
td.nw{white-space:normal}
tfoot td{background:#f8f9fc;font-weight:700;border-top:1px solid var(--line)}
.lnk{font-weight:600;color:var(--brand-d);cursor:pointer}
.lnk:hover{text-decoration:underline}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:var(--brand-d);font-weight:600}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty svg{width:34px;height:34px;color:#b7bfd2;margin-bottom:6px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid var(--line2);color:var(--muted);font-size:12.5px;flex-wrap:wrap}
.pager .btn{padding:5px 10px}
.rowacts{display:flex;gap:6px;justify-content:flex-end;align-items:center}

/* ---------- badges ---------- */
.b{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--slate-s);color:var(--ink2)}
.b.green{background:var(--green-s);color:var(--green)}.b.amber{background:var(--amber-s);color:var(--amber)}.b.red{background:var(--red-s);color:var(--red)}
.b.violet{background:var(--violet-s);color:var(--violet)}.b.blue{background:var(--brand-s);color:var(--brand-d)}.b.cyan{background:var(--cyan-s);color:var(--cyan)}
.qin{color:var(--green);font-weight:600}.qout{color:var(--red);font-weight:600}

/* ---------- dashboard ---------- */
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px}
.grid2>div{min-width:0}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line2)}
.list li:last-child{border-bottom:0}
.list .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.list .ic svg{width:18px;height:18px}
.list .tx{flex:1;min-width:0}
.list .tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .tx span{color:var(--muted);font-size:12.5px}
.list .rt{text-align:right;white-space:nowrap}
.ic.green{background:var(--green-s);color:var(--green)}.ic.red{background:var(--red-s);color:var(--red)}.ic.amber{background:var(--amber-s);color:var(--amber)}.ic.blue{background:var(--brand-s);color:var(--brand)}.ic.violet{background:var(--violet-s);color:var(--violet)}.ic.cyan{background:var(--cyan-s);color:var(--cyan)}
.hero{background:linear-gradient(120deg,#1f3a8a 0%,#2f54eb 60%,#5b7cfa 100%);color:#fff;border-radius:18px;padding:22px 24px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 12px 30px rgba(31,58,138,.25)}
.hero h1{font-size:23px;font-weight:800}
.hero p{margin:4px 0 0;opacity:.85}
.hero .btn{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff}
.hero .btn:hover{background:rgba(255,255,255,.22)}
.hero .btn.pri{background:#fff;color:var(--brand-d);border-color:#fff;box-shadow:none}

/* ---------- ledger head ---------- */
.lhead{display:flex;gap:14px;align-items:center;padding:16px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.lhead h2{font-size:18px}
.lhead .meta{color:var(--muted);font-size:13px}

/* ---------- dialogs ---------- */
.dlg{position:fixed;inset:0;background:rgba(15,20,40,.45);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:80;animation:fade .15s}
.dlg form,.dlg .box{background:var(--surface);border-radius:18px;width:100%;max-width:520px;max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:var(--sh-l);animation:pop .18s}
.dlg .box.wide{max-width:1080px}
.hbody{padding:12px 20px 4px;overflow-y:auto}
.hbody .stats{grid-template-columns:repeat(4,1fr)}
.hbody .filters{box-shadow:none;background:#f8f9fc}
.hbody .card{box-shadow:none}
.dh{padding:18px 20px 6px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dh h2{font-size:19px}.dh p{margin:3px 0 0;color:var(--muted);font-size:13px}
.db{padding:10px 20px 4px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.df{padding:14px 20px 18px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line2);margin-top:12px}
.fld{display:flex;flex-direction:column;gap:5px;grid-column:span 2}
.fld.half{grid-column:span 1}
.fld>label{font-size:12.5px;font-weight:600;color:var(--ink2)}
.fld>label .req{color:var(--red)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fbfcfe;outline:none;width:100%}
.fld textarea{min-height:70px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,84,235,.14);background:#fff}
.fld .help{font-size:12px;color:var(--muted)}
.fld .help.good{color:var(--green);font-weight:600}.fld .help.warn{color:var(--red);font-weight:600}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:6px;background:var(--line2);padding:4px;border-radius:12px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px}
.seg button.on{background:#fff;color:var(--brand-d);box-shadow:0 1px 3px rgba(20,26,46,.12)}
.inrow{display:flex;gap:6px;align-items:stretch}
.inrow select{flex:1;min-width:0}
.addbtn{padding:0 11px;border-radius:10px;color:var(--brand);border-color:#cdd8fb;background:var(--brand-s)}
.addbtn:hover{background:#dde6ff;border-color:#b9c9f8}
.dlg.mini{z-index:85;background:rgba(15,20,40,.25)}
.dlg.mini .box{max-width:380px}
.chk{display:flex;align-items:center;gap:9px;font-weight:500;cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--brand)}
.err{grid-column:span 2;color:var(--red);font-weight:600;font-size:13px;min-height:0}
.err:empty{display:none}
.summary{grid-column:span 2;background:var(--line2);border-radius:12px;padding:11px 13px;font-size:13px;color:var(--ink2)}
.summary b{color:var(--ink)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}}

/* ---------- auth ---------- */
.auth{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:radial-gradient(1200px 600px at 10% -10%,#dfe7ff 0,transparent 60%),radial-gradient(900px 500px at 110% 110%,#e7e0ff 0,transparent 55%),var(--bg);z-index:90}
.auth form{width:100%;max-width:400px;background:#fff;border-radius:20px;padding:30px 28px;box-shadow:var(--sh-l);display:flex;flex-direction:column;gap:14px}
.auth .logo{width:48px;height:48px;border-radius:14px}
.auth h1{font-size:23px;font-weight:800;margin-top:6px}
.auth p{margin:0;color:var(--muted)}
.auth .fld{grid-column:auto}
.auth .btn{justify-content:center;padding:11px}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#141a2e;color:#fff;padding:11px 18px;border-radius:12px;font-weight:500;z-index:99;box-shadow:var(--sh-l);max-width:calc(100vw - 32px);animation:pop .18s}
.toast.bad{background:var(--red)}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted)}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);animation:spin .8s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- mobile ---------- */
.bnav,.scrim{display:none}
@media (max-width:1100px){.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .side{position:fixed;left:0;top:0;transform:translateX(-102%);transition:transform .2s;box-shadow:var(--sh-l)}
  body.drawer .side{transform:none}
  body.drawer .scrim{display:block;position:fixed;inset:0;background:rgba(15,20,40,.4);z-index:25}
  .main{padding:14px 14px 96px}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;background:rgba(244,246,251,.92);backdrop-filter:blur(8px);margin:-14px -14px 12px;padding:10px 12px;border-bottom:1px solid var(--line)}
  .topbar b{font-family:var(--display);font-size:16px;flex:1}
  .ph h1{font-size:21px}
  .ph .acts .btn span.l{display:none}
  .stats{grid-template-columns:repeat(2,1fr);gap:9px}
  .stat{padding:10px 13px;min-height:54px}.stat .v{font-size:20px}.stat .l{font-size:12.5px}
  .filters select,.filters input[type=date]{flex:1 1 140px;max-width:none}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:20;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0;position:relative}
  .bnav a.on{color:var(--brand)}
  .bnav a.mid span.c{width:44px;height:44px;border-radius:14px;background:var(--brand);color:#fff;display:grid;place-items:center;margin-top:-18px;box-shadow:0 6px 16px rgba(47,84,235,.4)}
  .bnav .dot{position:absolute;top:0;right:calc(50% - 18px);background:var(--red);color:#fff;font-size:10px;border-radius:99px;padding:0 5px;min-width:16px;text-align:center}
  .dlg{align-items:flex-end;padding:0}

}

}
